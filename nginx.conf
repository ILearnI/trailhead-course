# The two copies of the app
upstream trailhead {
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
}

# Plain http only sends visitors to https
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://trailhead;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streams must not wait in a buffer
        proxy_buffering off;
        add_header X-Upstream $upstream_addr always;
    }
}
